services:
  # ---------------------------------------------------------
  # 1. Реляционная база данных PostgreSQL 17
  # ---------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: tradepulse-postgres
    profiles: [ "dev" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradepulse_password}
      POSTGRES_DB: ${POSTGRES_DB:-tradepulse_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradepulse} -d ${POSTGRES_DB:-tradepulse_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:17-alpine
    container_name: tradepulse-postgres-test
    profiles: [ "test" ]
    environment:
      POSTGRES_USER: tradepulse_test
      POSTGRES_PASSWORD: tradepulse_test_password
      POSTGRES_DB: tradepulse_test_db
    ports:
      - "5434:5432"
    # Храним тестовую БД в оперативной памяти (RAM) для максимальной скорости прогонов
    tmpfs:
      - /var/lib/postgresql/data
    # Отключаем гарантии долговечности диска (WAL fsync), так как база временная
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tradepulse_test -d tradepulse_test_db" ]
      interval: 2s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------
  # 2. Боевой сервис API (профиль "prod")
  # ---------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradepulse-api:latest
    container_name: tradepulse-api
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tradepulse}:${POSTGRES_PASSWORD:-tradepulse_password}@postgres:5432/${POSTGRES_DB:-tradepulse_db}
    networks:
      - tradepulse-network
    profiles:       
      - prod         

  # ---------------------------------------------------------
  # 3. Сервис для активной разработки (профиль "dev")
  # ---------------------------------------------------------
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradepulse-api:dev
    container_name: tradepulse-api-dev
    depends_on:
      - postgres
    command: >
      uvicorn tradepulse.main:app
      --app-dir src
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      - ./src:/app/src:ro
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tradepulse}:${POSTGRES_PASSWORD:-tradepulse_password}@postgres:5432/${POSTGRES_DB:-tradepulse_db}
    networks:
      - tradepulse-network
    profiles:
      - dev

  # ---------------------------------------------------------
  # 4. Вспомогательная утилита: почтовая заглушка Mailpit
  # ---------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: tradepulse-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - tradepulse-network
    profiles:
      - dev
      - tools

volumes:
  postgres_data:
    driver: local
  postgres_dev_data:

networks:
  tradepulse-network:
    driver: bridge
