[project]
name = "tradepulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.143.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.5.0",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=2.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.0",
]

[tool.ruff]
# Целевая версия интерпретатора для оптимизации синтаксических конструкций
target-version = "py313"

# Максимальная длина строки (стандартный компромисс между 79 по PEP 8 и 120)
line-length = 88

# Директории, исключаемые из проверок
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "migrations/versions",
]

[tool.ruff.lint]
# Базовый набор наборов правил:
# E / W  - Pyflakes / pycodestyle (ошибки синтаксиса и стиля)
# F      - Pyflakes (неиспользуемые переменные, ошибки импортов)
# I      - isort (автоматическая сортировка импортов)
# B      - flake8-bugbear (типичные ошибки и логические ловушки)
# C4     - flake8-comprehensions (оптимизация списковых включений)
# UP     - pyupgrade (актуализация синтаксиса под Python 3.13)
# SIM    - flake8-simplify (упрощение громоздких ветвлений и логики)
# T20    - flake8-print (запрет отладочных вызовов print в продакшене)
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "T20",
]

# Исключения из правил (при необходимости)
ignore = [
    "E501",  # Перенос длинных строк передается на откуп ruff format
]

[tool.ruff.lint.isort]
# Группировка собственного пакета в отдельный блок импортов
known-first-party = ["tradepulse"]

[tool.ruff.format]
# Настройки автоформаттера (полная совместимость с конвенциями Black)
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Разрешаем использование assert в тестах
    "ARG",     # Разрешаем неиспользуемые аргументы (фикстуры pytest передаются по имени)
    "PLR2004", # Разрешаем "магические" числа в тестовых проверках (например, статус-код 201)
]

[tool.pytest.ini_options]
# Корневой каталог поиска тестов
testpaths = ["tests"]
# Явное добавление src в PYTHONPATH при запуске pytest
pythonpath = ["src"]
# Автоматический режим для асинхронных тестов (не нужно вешать @pytest.mark.asyncio на каждый тест)
asyncio_mode = "auto"
# Единый scope цикла событий для предотвращения конфликтов пула asyncpg между тестами
asyncio_default_fixture_loop_scope = "session"
# Полезные флаги по умолчанию: подробный вывод, строгость маркеров и вывод 5 самых медленных тестов
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--durations=5",
]
# Регистрация пользовательских маркеров для выборочного запуска
markers = [
    "unit: быстрые модульные тесты без внешних зависимостей",
    "integration: интеграционные тесты с реальной базой данных PostgreSQL",
]

asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
# Измеряем покрытие только исходного кода нашего пакета
source = ["src/tradepulse"]
# Обязательно включаем анализ ветвлений (if/else, try/except)
branch = true
# Исключаем служебные файлы инициализации без логики
omit = [
    "src/tradepulse/__init__.py",
    "src/tradepulse/*/__init__.py",
]

[tool.coverage.report]
# Показывать номера конкретных непокрытых строк прямо в терминале
show_missing = true
# Пропускать в таблице файлы со 100% покрытием, чтобы фокусироваться на пробелах
skip_covered = false
# Точность округления процентов до двух знаков
precision = 2
# Минимальный порог покрытия: если упадет ниже 80%, pytest завершится с ошибкой
fail_under = 80.0
# Стандартные конструкции, которые не должны снижать метрику покрытия
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.coverage.html]
# Каталог для генерации интерактивного HTML-отчета
directory = "htmlcov"
